<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dastkari - Bespoke Furniture</title>
  
  <!-- Montserrat Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      text-transform: capitalize; /* Ensures Title Case across text elements */
    }

    body {
      background-color: #ffffff;
      color: #111111;
      padding: 30px 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .app-header {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #111111;
    }

    .staff-login-btn {
      font-size: 0.8rem;
      font-weight: 600;
      color: #111111;
      background: transparent;
      border: 1.5px solid #111111;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .staff-login-btn:hover {
      background: #111111;
      color: #ffffff;
    }

    /* Search Toolbar */
    .toolbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      font-size: 0.88rem;
      border: 1.5px solid #222222;
      border-radius: 6px;
      background: #ffffff;
      color: #111111;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: #666666;
      pointer-events: none;
    }

    /* Category Scroll Bar with Visible Scrollbar & Drag Support */
    .category-pills-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto 25px auto;
      overflow-x: auto;
      white-space: nowrap;
      padding: 8px 0 12px 0;
      cursor: grab;
      user-select: none;
      scrollbar-width: thin;
      scrollbar-color: #222222 #e0e0e0;
    }

    .category-pills-container::-webkit-scrollbar {
      height: 6px;
    }

    .category-pills-container::-webkit-scrollbar-track {
      background: #f0f0f0;
      border-radius: 4px;
    }

    .category-pills-container::-webkit-scrollbar-thumb {
      background: #222222;
      border-radius: 4px;
    }

    .category-pills-container:active {
      cursor: grabbing;
    }

    .category-pills-wrapper {
      display: inline-flex;
      gap: 10px;
    }

    .pill-btn {
      padding: 8px 18px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      background: #ffffff;
      color: #666666;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .pill-btn.active {
      background: #222222;
      color: #ffffff;
      border-color: #222222;
    }

    /* Grid Layout */
    .catalog-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    .card {
      background: #ffffff;
      border: 1.5px solid #222222;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #000000;
    }

    /* Front Card Image: Fill Card (Cover) */
    .card-image-wrapper {
      width: 100%;
      height: 220px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #f5f5f5;
    }

    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 2px 4px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      color: #111111;
    }

    .card-category {
      font-size: 0.75rem;
      font-weight: 500;
      color: #666666;
      letter-spacing: 0.5px;
    }

    .card-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .card-price {
      font-size: 0.85rem;
      font-weight: 700;
      color: #111111;
    }

    .card-dims {
      font-size: 0.75rem;
      color: #888888;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: #ffffff;
      border-radius: 12px;
      border: 1.5px solid #222222;
      width: 100%;
      max-width: 850px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .modal-container {
        grid-template-columns: 1fr;
      }
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      font-weight: 700;
      color: #111111;
      cursor: pointer;
    }

    .modal-gallery {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Inside Modal Image: Entire Image (Contain) */
    .modal-main-img-box {
      width: 100%;
      height: 320px;
      border-radius: 8px;
      overflow: hidden;
      background: #f8f9fa;
    }

    .modal-main-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .modal-thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .modal-thumb {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-thumb.active {
      border-color: #222222;
    }

    .modal-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      padding: 20px 0;
    }

    .login-input {
      padding: 10px 14px;
      border: 1.5px solid #222222;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-submit {
      padding: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: #222222;
      color: #ffffff;
      cursor: pointer;
    }

    .empty-state, .error-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: #666666;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-top">
      <h1 class="brand-title">Dastkari - Bespoke Furniture</h1>
      <button class="staff-login-btn" onclick="openStaffModal()">Staff Login</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search Catalog...">
      </div>
    </div>
  </header>

  <!-- Scrollable Category Pills Bar -->
  <nav class="category-pills-container" id="pills-container">
    <div class="category-pills-wrapper" id="pills-wrapper">
      <button class="pill-btn active" onclick="selectCategory('ALL', this)">All</button>
      <button class="pill-btn" onclick="selectCategory('BEDS', this)">Beds</button>
      <button class="pill-btn" onclick="selectCategory('SOFAS', this)">Sofas</button>
      <button class="pill-btn" onclick="selectCategory('DAY BED / COT', this)">Day Bed / Cot</button>
      <button class="pill-btn" onclick="selectCategory('ARMCHAIRS', this)">Armchairs</button>
      <button class="pill-btn" onclick="selectCategory('CHAIRS', this)">Chairs</button>
      <button class="pill-btn" onclick="selectCategory('BAR STOOLS & TABLES', this)">Bar Stools & Tables</button>
      <button class="pill-btn" onclick="selectCategory('FLOOR SEATING', this)">Floor Seating</button>
      <button class="pill-btn" onclick="selectCategory('POUFFE / OTTOMAN', this)">Pouffe / Ottoman</button>
      <button class="pill-btn" onclick="selectCategory('BENCH', this)">Bench</button>
    </div>
  </nav>

  <!-- Catalog Grid -->
  <main class="catalog-container">
    <div class="catalog-grid" id="catalog-grid"></div>
  </main>

  <!-- Product Details Modal -->
  <div class="modal-overlay" id="item-modal">
    <div class="modal-container">
      <button class="modal-close-btn" onclick="closeModal('item-modal')">&times;</button>
      
      <div class="modal-gallery">
        <div class="modal-main-img-box">
          <img id="modal-img" src="" alt="Detail View">
        </div>
        <div class="modal-thumbs" id="modal-thumbs"></div>
      </div>

      <div class="modal-details">
        <div>
          <span class="card-category" id="modal-category">Category</span>
          <h2 id="modal-title" style="margin-top: 4px;">Title</h2>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem;">
          <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;">
            <span style="color: #666;">Item ID</span>
            <strong id="modal-id">ITEM-000</strong>
          </div>
          <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;">
            <span style="color: #666;">Dimensions</span>
            <strong id="modal-dims">Custom</strong>
          </div>
          <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px;">
            <span style="color: #666;">Price</span>
            <strong id="modal-price">Price On Request</strong>
          </div>
        </div>

        <button class="btn-submit" onclick="alert('Inquiry Submitted!')">Request Quote</button>
      </div>
    </div>
  </div>

  <!-- Staff Login Modal -->
  <div class="modal-overlay" id="staff-modal">
    <div class="modal-container" style="max-width: 420px; grid-template-columns: 1fr;">
      <button class="modal-close-btn" onclick="closeModal('staff-modal')">&times;</button>
      <h2 style="text-align: center; font-size: 1.4rem;">Staff Portal Access</h2>
      <form class="login-form" onsubmit="event.preventDefault(); alert('Login Submitted'); closeModal('staff-modal');">
        <input type="text" class="login-input" placeholder="Employee ID" required>
        <input type="password" class="login-input" placeholder="Password" required>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    let catalogData = [];
    let activeCategory = 'ALL';
    let searchQuery = '';

    const grid = document.getElementById('catalog-grid');
    const pillsWrapper = document.getElementById('pills-wrapper');
    const pillsContainer = document.getElementById('pills-container');
    const searchInput = document.getElementById('search-input');

    async function init() {
      try {
        let response = await fetch('./catalog_data.json');
        if (!response.ok) response = await fetch('./Assets/catalog_data.json');
        if (!response.ok) throw new Error('Catalog data missing.');

        catalogData = await response.json();
        renderPills();
        renderGrid();
      } catch (err) {
        grid.innerHTML = `<div class="error-msg">Could Not Load catalog_data.json</div>`;
      }
    }

    function renderPills() {
      if (!catalogData || catalogData.length === 0) return;
      const categories = ['ALL', ...new Set(catalogData.map(item => item.category))];
      
      pillsWrapper.innerHTML = categories.map(cat => `
        <button class="pill-btn ${cat.toUpperCase() === activeCategory.toUpperCase() ? 'active' : ''}" onclick="selectCategory('${cat}', this)">
          ${cat}
        </button>
      `).join('');
    }

    function selectCategory(cat, btnEl) {
      activeCategory = cat;
      document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderGrid();
    }

    function renderGrid() {
      const items = catalogData.filter(item => {
        const matchesCat = activeCategory.toUpperCase() === 'ALL' || item.category.toUpperCase() === activeCategory.toUpperCase();
        const matchesSearch = item.title.toLowerCase().includes(searchQuery) ||
                              item.category.toLowerCase().includes(searchQuery) ||
                              item.id.toLowerCase().includes(searchQuery);
        return matchesCat && matchesSearch;
      });

      if (items.length === 0) {
        grid.innerHTML = `<div class="empty-state">No Matching Items Found</div>`;
        return;
      }

      grid.innerHTML = items.map(item => {
        const imgSrc = (item.images && item.images.length > 0) ? item.images[0] : '';

        return `
          <div class="card" onclick="openItemModal('${item.id}')">
            <div class="card-image-wrapper">
              <img src="${imgSrc}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/240?text=No+Image'">
            </div>
            <div class="card-info">
              <div class="card-title">${item.title}</div>
              <div class="card-category">${item.category}</div>
              <div class="card-footer-row">
                <span class="card-price">${item.price}</span>
                <span class="card-dims">${item.dims}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* Modal Handlers */
    function openItemModal(id) {
      const item = catalogData.find(i => i.id === id);
      if (!item) return;

      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-category').textContent = item.category;
      document.getElementById('modal-id').textContent = item.id;
      document.getElementById('modal-dims').textContent = item.dims;
      document.getElementById('modal-price').textContent = item.price;

      const modalImg = document.getElementById('modal-img');
      const modalThumbs = document.getElementById('modal-thumbs');

      if (item.images && item.images.length > 0) {
        modalImg.src = item.images[0];
        modalThumbs.innerHTML = item.images.map((img, idx) => `
          <div class="modal-thumb ${idx === 0 ? 'active' : ''}" onclick="setModalImage('${img}', this, event)">
            <img src="${img}" alt="Thumbnail">
          </div>
        `).join('');
      }

      document.getElementById('item-modal').classList.add('active');
    }

    function openStaffModal() {
      document.getElementById('staff-modal').classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function setModalImage(src, thumbEl, event) {
      event.stopPropagation();
      document.getElementById('modal-img').src = src;
      document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
      thumbEl.classList.add('active');
    }

    /* Horizontal Scrolling via Mouse Wheel, Drag, and Touch */
    pillsContainer.addEventListener('wheel', (evt) => {
      evt.preventDefault();
      pillsContainer.scrollLeft += evt.deltaY;
    });

    let isDown = false;
    let startX;
    let scrollLeft;

    pillsContainer.addEventListener('mousedown', (e) => {
      isDown = true;
      startX = e.pageX - pillsContainer.offsetLeft;
      scrollLeft = pillsContainer.scrollLeft;
    });

    pillsContainer.addEventListener('mouseleave', () => { isDown = false; });
    pillsContainer.addEventListener('mouseup', () => { isDown = false; });
    
    pillsContainer.addEventListener('mousemove', (e) => {
      if(!isDown) return;
      e.preventDefault();
      const x = e.pageX - pillsContainer.offsetLeft;
      const walk = (x - startX) * 2;
      pillsContainer.scrollLeft = scrollLeft - walk;
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderGrid();
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
