<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dastkari - bespoke furniture</title>
  
  <!-- Montserrat Font Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --text-light: #888888;
      --border-color: #222222;
      --border-light: #e0e0e0;
      --radius-card: 12px;
      --radius-img: 8px;
      --radius-button: 6px;
      --shadow-subtle: 0 4px 12px rgba(0, 0, 0, 0.05);
      --transition-base: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --bg-card: #181818;
      --text-main: #f0f0f0;
      --text-muted: #a0a0a0;
      --text-light: #777777;
      --border-color: #444444;
      --border-light: #2d2d2d;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 40px;
      -webkit-font-smoothing: antialiased;
    }

    .top-banner {
      background-color: var(--border-color);
      color: var(--bg-primary);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      padding: 8px 16px;
      font-weight: 500;
    }

    .app-header {
      max-width: 1300px;
      margin: 20px auto 20px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .brand-title {
      font-family: var(--font-family);
      font-size: 2rem;
      font-weight: 700;
      text-transform: lowercase;
      letter-spacing: 1px;
      text-align: center;
    }

    .toolbar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }

    .search-group {
      position: relative;
      flex: 1;
      min-width: 250px;
      max-width: 450px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      font-family: var(--font-family);
      font-size: 0.88rem;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-button);
      background: var(--bg-secondary);
      color: var(--text-main);
      outline: none;
      transition: var(--transition-base);
    }

    .search-input:focus {
      border-color: var(--border-color);
      background: var(--bg-primary);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .select-control {
      padding: 10px 14px;
      font-family: var(--font-family);
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-button);
      background: var(--bg-secondary);
      color: var(--text-main);
      cursor: pointer;
      outline: none;
    }

    .btn-action {
      padding: 10px 16px;
      font-family: var(--font-family);
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-button);
      background: var(--bg-primary);
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition-base);
    }

    .btn-action:hover {
      background: var(--text-main);
      color: var(--bg-primary);
    }

    .category-pills-container {
      width: 100%;
      max-width: 1300px;
      margin: 0 auto 25px auto;
      padding: 0 20px 8px 20px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .category-pills-wrapper {
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }

    .pill-btn {
      padding: 8px 16px;
      font-family: var(--font-family);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid var(--border-light);
      border-radius: 20px;
      background: var(--bg-primary);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition-base);
    }

    .pill-btn.active {
      background: var(--border-color);
      color: var(--bg-primary);
      border-color: var(--border-color);
    }

    .catalog-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-subtle);
    }

    .card-image-wrapper {
      width: 100%;
      height: 220px;
      border-radius: var(--radius-img);
      overflow: hidden;
      background-color: var(--bg-secondary);
      position: relative;
    }

    /* FRONT PIC: FILL CARD */
    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    body.fit-contain .card-image-wrapper img {
      object-fit: contain;
    }

    .image-count-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 2px 4px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-main);
    }

    .card-category {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .card-price {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .card-dims {
      font-size: 0.75rem;
      color: var(--text-light);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: var(--bg-card);
      border-radius: var(--radius-card);
      border: 1.5px solid var(--border-color);
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .modal-container {
        grid-template-columns: 1fr;
      }
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-gallery {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* INSIDE PIC: ENTIRE PIC (CONTAIN) */
    .modal-main-img-box {
      width: 100%;
      height: 320px;
      border-radius: var(--radius-img);
      overflow: hidden;
      background: var(--bg-secondary);
    }

    .modal-main-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .modal-thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .modal-thumb {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-button);
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-thumb.active {
      border-color: var(--border-color);
    }

    .modal-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-details {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }

    .modal-details h2 {
      font-size: 1.4rem;
    }

    .modal-meta-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.88rem;
    }

    .modal-meta-item {
      display: flex;
      justify-content: space-between;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-light);
    }

    .modal-meta-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .modal-meta-value {
      font-weight: 600;
    }

    .empty-state, .error-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="top-banner">
    HANDCRAFTED BESPOKE LUXURY FURNITURE &bull; CUSTOM DIMENSIONS AVAILABLE
  </div>

  <header class="app-header">
    <h1 class="brand-title">dastkari - bespoke furniture</h1>
    
    <div class="toolbar">
      <div class="search-group">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search catalog...">
      </div>

      <div class="controls-group">
        <select id="sort-select" class="select-control">
          <option value="default">Default Order</option>
          <option value="title-asc">Title (A-Z)</option>
          <option value="category">Category</option>
        </select>

        <button id="toggle-fit-btn" class="btn-action">Mode: Fill Card</button>
        <button id="toggle-theme-btn" class="btn-action">Dark Mode</button>
      </div>
    </div>
  </header>

  <nav class="category-pills-container">
    <div class="category-pills-wrapper" id="pills-wrapper"></div>
  </nav>

  <main class="catalog-container">
    <div class="catalog-grid" id="catalog-grid"></div>
  </main>

  <div class="modal-overlay" id="item-modal">
    <div class="modal-container">
      <button class="modal-close-btn" id="modal-close">&times;</button>
      
      <div class="modal-gallery">
        <div class="modal-main-img-box">
          <img id="modal-img" src="" alt="Detail View">
        </div>
        <div class="modal-thumbs" id="modal-thumbs"></div>
      </div>

      <div class="modal-details">
        <div>
          <span class="card-category" id="modal-category">CATEGORY</span>
          <h2 id="modal-title" style="margin-top: 4px;">Title</h2>
        </div>

        <div class="modal-meta-list">
          <div class="modal-meta-item">
            <span class="modal-meta-label">Item ID</span>
            <span class="modal-meta-value" id="modal-id">ITEM-000</span>
          </div>
          <div class="modal-meta-item">
            <span class="modal-meta-label">Dimensions</span>
            <span class="modal-meta-value" id="modal-dims">Custom</span>
          </div>
          <div class="modal-meta-item">
            <span class="modal-meta-label">Price</span>
            <span class="modal-meta-value" id="modal-price">Price on Request</span>
          </div>
        </div>

        <button class="btn-action" style="justify-content: center; padding: 12px;" onclick="alert('Inquiry recorded!')">
          Request Quote
        </button>
      </div>
    </div>
  </div>

  <script>
    let catalogData = [];
    let activeCategory = 'ALL';
    let searchQuery = '';
    let sortMode = 'default';
    let isCoverMode = true;

    const grid = document.getElementById('catalog-grid');
    const pillsWrapper = document.getElementById('pills-wrapper');
    const searchInput = document.getElementById('search-input');
    const sortSelect = document.getElementById('sort-select');
    const toggleFitBtn = document.getElementById('toggle-fit-btn');
    const toggleThemeBtn = document.getElementById('toggle-theme-btn');

    const modal = document.getElementById('item-modal');
    const modalClose = document.getElementById('modal-close');
    const modalImg = document.getElementById('modal-img');
    const modalThumbs = document.getElementById('modal-thumbs');
    const modalTitle = document.getElementById('modal-title');
    const modalCategory = document.getElementById('modal-category');
    const modalId = document.getElementById('modal-id');
    const modalDims = document.getElementById('modal-dims');
    const modalPrice = document.getElementById('modal-price');

    async function init() {
      try {
        let response = await fetch('./catalog_data.json');
        if (!response.ok) response = await fetch('./Assets/catalog_data.json');
        if (!response.ok) throw new Error('Catalog data not found.');

        catalogData = await response.json();
        renderPills();
        renderGrid();
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="error-msg">Could not load catalog_data.json</div>`;
      }
    }

    function renderPills() {
      const categories = ['ALL', ...new Set(catalogData.map(item => item.category))];
      
      pillsWrapper.innerHTML = categories.map(cat => `
        <button class="pill-btn ${cat === activeCategory ? 'active' : ''}" data-category="${cat}">
          ${cat}
        </button>
      `).join('');

      pillsWrapper.querySelectorAll('.pill-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          activeCategory = e.target.dataset.category;
          pillsWrapper.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          renderGrid();
        });
      });
    }

    function getFilteredItems() {
      return catalogData
        .filter(item => {
          const matchesCat = activeCategory === 'ALL' || item.category === activeCategory;
          const matchesSearch = item.title.toLowerCase().includes(searchQuery) ||
                                item.category.toLowerCase().includes(searchQuery) ||
                                item.id.toLowerCase().includes(searchQuery);
          return matchesCat && matchesSearch;
        })
        .sort((a, b) => {
          if (sortMode === 'title-asc') return a.title.localeCompare(b.title);
          if (sortMode === 'category') return a.category.localeCompare(b.category);
          return 0;
        });
    }

    function renderGrid() {
      const items = getFilteredItems();

      if (items.length === 0) {
        grid.innerHTML = `<div class="empty-state">No matching items found</div>`;
        return;
      }

      grid.innerHTML = items.map(item => {
        const imgSrc = (item.images && item.images.length > 0) ? item.images[0] : '';
        const imgCount = item.images ? item.images.length : 0;

        return `
          <div class="card" onclick="openModal('${item.id}')">
            <div class="card-image-wrapper">
              <img src="${imgSrc}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/240?text=No+Image'">
              ${imgCount > 1 ? `<span class="image-count-badge">+${imgCount} Photos</span>` : ''}
            </div>
            <div class="card-info">
              <div class="card-title">${item.title}</div>
              <div class="card-category">${item.category}</div>
              <div class="card-footer-row">
                <span class="card-price">${item.price}</span>
                <span class="card-dims">${item.dims}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.openModal = function(id) {
      const item = catalogData.find(i => i.id === id);
      if (!item) return;

      modalTitle.textContent = item.title;
      modalCategory.textContent = item.category;
      modalId.textContent = item.id;
      modalDims.textContent = item.dims;
      modalPrice.textContent = item.price;

      if (item.images && item.images.length > 0) {
        modalImg.src = item.images[0];
        modalThumbs.innerHTML = item.images.map((img, idx) => `
          <div class="modal-thumb ${idx === 0 ? 'active' : ''}" onclick="setModalImage('${img}', this, event)">
            <img src="${img}" alt="Thumbnail">
          </div>
        `).join('');
      } else {
        modalImg.src = 'https://via.placeholder.com/400?text=No+Image';
        modalThumbs.innerHTML = '';
      }

      modal.classList.add('active');
    };

    window.setModalImage = function(src, thumbEl, event) {
      event.stopPropagation();
      modalImg.src = src;
      modalThumbs.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
      thumbEl.classList.add('active');
    };

    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderGrid();
    });

    sortSelect.addEventListener('change', (e) => {
      sortMode = e.target.value;
      renderGrid();
    });

    toggleFitBtn.addEventListener('click', () => {
      isCoverMode = !isCoverMode;
      document.body.classList.toggle('fit-contain', !isCoverMode);
      toggleFitBtn.textContent = isCoverMode ? 'Mode: Fill Card' : 'Mode: Fit Entire Image';
    });

    toggleThemeBtn.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      toggleThemeBtn.textContent = isDark ? 'Dark Mode' : 'Light Mode';
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
