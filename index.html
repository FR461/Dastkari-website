<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dastkari - bespoke furniture</title>
  
  <!-- Montserrat Font Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ffffff;
      color: #111111;
      padding: 30px 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Brand Title */
    .app-header {
      max-width: 1200px;
      margin: 0 auto 30px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      text-transform: lowercase;
      letter-spacing: 1px;
      text-align: center;
      color: #111111;
    }

    /* Search Bar */
    .search-box {
      width: 100%;
      max-width: 450px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
      border: 1.5px solid #222222;
      border-radius: 6px;
      background: #ffffff;
      color: #111111;
      outline: none;
    }

    .search-input:focus {
      border-color: #000000;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: #666666;
      pointer-events: none;
    }

    /* Catalog Grid */
    .catalog-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    /* Card Layout */
    .card {
      background: #ffffff;
      border: 1.5px solid #222222;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #000000;
    }

    /* FRONT PIC: FILL CARD */
    .card-image-wrapper {
      width: 100%;
      height: 220px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #f5f5f5;
    }

    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Fills card completely */
      object-position: center;
      display: block;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 2px 4px;
    }

    .card-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      color: #111111;
    }

    .card-category {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      color: #666666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .card-price {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #111111;
    }

    .card-dims {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      color: #888888;
    }

    /* Modal / Lightbox */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: #ffffff;
      border-radius: 12px;
      border: 1.5px solid #222222;
      width: 100%;
      max-width: 850px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .modal-container {
        grid-template-columns: 1fr;
      }
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      font-weight: 700;
      color: #111111;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .modal-gallery {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* INSIDE PIC: ENTIRE PIC (CONTAIN) */
    .modal-main-img-box {
      width: 100%;
      height: 320px;
      border-radius: 8px;
      overflow: hidden;
      background: #f8f9fa;
    }

    .modal-main-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Displays full image without cropping */
      display: block;
    }

    .modal-thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .modal-thumb {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-thumb.active {
      border-color: #222222;
    }

    .modal-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-details {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }

    .modal-details h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .modal-meta-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.88rem;
    }

    .modal-meta-item {
      display: flex;
      justify-content: space-between;
      padding-bottom: 6px;
      border-bottom: 1px solid #e0e0e0;
    }

    .modal-meta-label {
      color: #666666;
      font-weight: 500;
    }

    .modal-meta-value {
      font-weight: 600;
    }

    .btn-quote {
      padding: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1.5px solid #222222;
      border-radius: 6px;
      background: #222222;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s ease;
      text-align: center;
    }

    .btn-quote:hover {
      background: #000000;
    }

    .empty-state, .error-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: #666666;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <h1 class="brand-title">dastkari - bespoke furniture</h1>
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search catalog...">
    </div>
  </header>

  <!-- Catalog Grid -->
  <main class="catalog-container">
    <div class="catalog-grid" id="catalog-grid"></div>
  </main>

  <!-- Modal Lightbox -->
  <div class="modal-overlay" id="item-modal">
    <div class="modal-container">
      <button class="modal-close-btn" id="modal-close">&times;</button>
      
      <div class="modal-gallery">
        <div class="modal-main-img-box">
          <img id="modal-img" src="" alt="Detail View">
        </div>
        <div class="modal-thumbs" id="modal-thumbs"></div>
      </div>

      <div class="modal-details">
        <div>
          <span class="card-category" id="modal-category">CATEGORY</span>
          <h2 id="modal-title" style="margin-top: 4px;">Title</h2>
        </div>

        <div class="modal-meta-list">
          <div class="modal-meta-item">
            <span class="modal-meta-label">Item ID</span>
            <span class="modal-meta-value" id="modal-id">ITEM-000</span>
          </div>
          <div class="modal-meta-item">
            <span class="modal-meta-label">Dimensions</span>
            <span class="modal-meta-value" id="modal-dims">Custom</span>
          </div>
          <div class="modal-meta-item">
            <span class="modal-meta-label">Price</span>
            <span class="modal-meta-value" id="modal-price">Price on Request</span>
          </div>
        </div>

        <button class="btn-quote" onclick="alert('Inquiry submitted!')">Request Quote</button>
      </div>
    </div>
  </div>

  <script>
    let catalogData = [];
    let searchQuery = '';

    const grid = document.getElementById('catalog-grid');
    const searchInput = document.getElementById('search-input');

    const modal = document.getElementById('item-modal');
    const modalClose = document.getElementById('modal-close');
    const modalImg = document.getElementById('modal-img');
    const modalThumbs = document.getElementById('modal-thumbs');
    const modalTitle = document.getElementById('modal-title');
    const modalCategory = document.getElementById('modal-category');
    const modalId = document.getElementById('modal-id');
    const modalDims = document.getElementById('modal-dims');
    const modalPrice = document.getElementById('modal-price');

    async function init() {
      try {
        let response = await fetch('./catalog_data.json');
        if (!response.ok) response = await fetch('./Assets/catalog_data.json');
        if (!response.ok) throw new Error('Catalog data not found.');

        catalogData = await response.json();
        renderGrid();
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="error-msg">Could not load catalog_data.json</div>`;
      }
    }

    function renderGrid() {
      const items = catalogData.filter(item => 
        item.title.toLowerCase().includes(searchQuery) ||
        item.category.toLowerCase().includes(searchQuery) ||
        item.id.toLowerCase().includes(searchQuery)
      );

      if (items.length === 0) {
        grid.innerHTML = `<div class="empty-state">No matching items found</div>`;
        return;
      }

      grid.innerHTML = items.map(item => {
        const imgSrc = (item.images && item.images.length > 0) ? item.images[0] : '';

        return `
          <div class="card" onclick="openModal('${item.id}')">
            <div class="card-image-wrapper">
              <img src="${imgSrc}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/240?text=No+Image'">
            </div>
            <div class="card-info">
              <div class="card-title">${item.title}</div>
              <div class="card-category">${item.category}</div>
              <div class="card-footer-row">
                <span class="card-price">${item.price}</span>
                <span class="card-dims">${item.dims}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.openModal = function(id) {
      const item = catalogData.find(i => i.id === id);
      if (!item) return;

      modalTitle.textContent = item.title;
      modalCategory.textContent = item.category;
      modalId.textContent = item.id;
      modalDims.textContent = item.dims;
      modalPrice.textContent = item.price;

      if (item.images && item.images.length > 0) {
        modalImg.src = item.images[0];
        modalThumbs.innerHTML = item.images.map((img, idx) => `
          <div class="modal-thumb ${idx === 0 ? 'active' : ''}" onclick="setModalImage('${img}', this, event)">
            <img src="${img}" alt="Thumbnail">
          </div>
        `).join('');
      } else {
        modalImg.src = 'https://via.placeholder.com/400?text=No+Image';
        modalThumbs.innerHTML = '';
      }

      modal.classList.add('active');
    };

    window.setModalImage = function(src, thumbEl, event) {
      event.stopPropagation();
      modalImg.src = src;
      modalThumbs.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
      thumbEl.classList.add('active');
    };

    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderGrid();
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
