<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dastkari - Bespoke Furniture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #ffffff;
      color: #111111;
      padding: 30px 20px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Catalog Grid */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Original Card Styling with Gap Fix */
    .card {
      background: #ffffff;
      border: 1.5px solid #222222; /* Clean dark border matching screenshot */
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: #000000;
    }

    /* Fixed Image Container (No side/top gaps) */
    .card-image-wrapper {
      width: 100%;
      height: 200px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #f5f5f5;
    }

    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Fills card completely, removing blank side gaps */
      display: block;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 2px 4px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .card-category {
      font-size: 0.75rem;
      color: #666666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-price {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .error-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 20px;
      color: #c92a2a;
    }
  </style>
</head>
<body>

  <h1>Dastkari Catalog</h1>

  <main class="catalog-grid" id="catalog-grid">
    <!-- Items render here -->
  </main>

  <script>
    async function loadCatalog() {
      const grid = document.getElementById('catalog-grid');

      try {
        let response = await fetch('./catalog_data.json');
        if (!response.ok) {
          response = await fetch('./Assets/catalog_data.json');
        }
        if (!response.ok) throw new Error('Data file not found');

        const items = await response.json();
        renderGrid(items);
      } catch (err) {
        grid.innerHTML = `<div class="error-msg">Could not load catalog_data.json</div>`;
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const imgSrc = (item.images && item.images.length > 0) ? item.images[0] : '';

        card.innerHTML = `
          <div class="card-image-wrapper">
            <img src="${imgSrc}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
          </div>
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-category">${item.category}</div>
            <div class="card-price">${item.price}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', loadCatalog);
  </script>

</body>
