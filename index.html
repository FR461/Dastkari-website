<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dastkari Bespoke Catalog</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e2e2;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    /* FIX FOR IMAGE GAPS */
    .card-image-container {
      width: 100%;
      height: 220px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #ffffff;
      border: 1px solid #ccc;
    }

    .card-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Fills container completely without leaving side or top gaps */
      object-position: center;
      display: block;
    }

    .card-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #111;
    }

    .card-category {
      font-size: 0.8rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #444;
      margin-top: 4px;
    }

    .error-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #d9534f;
      padding: 20px;
      background: #fdf2f2;
      border-radius: 8px;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <header>
    <h1>DASTKARI BESPOKE</h1>
  </header>

  <main class="catalog-grid" id="catalog-grid">
    <!-- Dynamic Cards Render Here -->
  </main>

  <script>
    async function loadCatalog() {
      const grid = document.getElementById('catalog-grid');
      
      try {
        // Automatically check both possible locations for catalog_data.json
        let response = await fetch('./catalog_data.json');
        if (!response.ok) {
          response = await fetch('./Assets/catalog_data.json');
        }
        if (!response.ok) throw new Error('Catalog data file not found');

        const items = await response.json();
        renderCatalog(items);
      } catch (error) {
        console.error(error);
        grid.innerHTML = `
          <div class="error-msg">
            <strong>Could not load catalog_data.json</strong><br>
            Please make sure <code>catalog_data.json</code> is saved in your project folder and you are running a local web server (e.g., Live Server).
          </div>
        `;
      }
    }

    function renderCatalog(items) {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const imgSrc = (item.images && item.images.length > 0) ? item.images[0] : '';

        card.innerHTML = `
          <div class="card-image-container">
            <img src="${imgSrc}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300?text=Image+Not+Found'">
          </div>
          <div class="card-details">
            <div class="card-title">${item.title}</div>
            <div class="card-category">${item.category}</div>
            <div class="card-meta">
              <span>${item.dims}</span>
              <strong>${item.price}</strong>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', loadCatalog);
  </script>

</body>
</html>
